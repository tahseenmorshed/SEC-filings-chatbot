[project]
name = "filings-analyst"
version = "0.1.0"
description = "Grounded Filings Analyst — a RAG system over SEC filings that never hallucinates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.117.0",
    "fastapi>=0.139.2",
    "fastembed>=0.8.0",
    "httpx>=0.27",
    "numpy>=2.2.6",
    "pydantic-settings>=2.2",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# dev deps installed by default via `uv sync`
default-groups = "all"

[dependency-groups]
dev = ["pytest>=8.0"]
